services:
  anti-clog:
    build: .
    container_name: printer-anti-clog
    restart: unless-stopped
    # 第二道护栏：健康探针曾泄漏到 8037 个线程；正常 NiceGUI/调度器只需几十个。
    # 异常膨胀时由 cgroup 先拦住，避免再次拖垮整台 ubuntu-dev。
    pids_limit: 512
    ports:
      - "18080:18080"
    volumes:
      # 配置与打印日志持久化到宿主机 ./data 目录（容器重建不丢失）
      - ./data:/app/data
    environment:
      # === 必填 ===
      - PRINTER_IP=192.168.0.228
      # === 可选（有默认值） ===
      - PRINTER_PORT=631
      - PRINTER_IPP_PATH=/ipp/print
      - SCHEDULE_FREQUENCY=every_2   # daily / every_2 / every_3 / every_5 / every_7
      - SCHEDULE_HOUR=9
      - SCHEDULE_MINUTE=0
      - CUSTOM_TEXT=
      # 打印图案：coverage=全喷嘴斜线覆盖页（推荐，防堵主力：斜线幕铺满整页高度，
      #                   每个颜色的每一行喷孔每趟走纸都会出墨）
      #           classic=经典彩色页 | link_test=只打一条细色带（仅验证链路，不防堵）
      - PATTERN=coverage
      # 覆盖强度：eco(省墨≈1.2%) / standard(标准≈2.3%，推荐) / strong(加强≈4.6%)
      - DUTY=standard
      # ⚠️ TEST_MODE=1 只打一条 6px 细色带（300dpi 下≈9 行喷孔，不足喷头高度的 5%），
      #    长期开这个＝只润湿少数喷孔，正是黑色局部堵头的原因。仅排查"能不能打出来"时临时开。
      - TEST_MODE=0
      # 测试页旋转补偿：一般无需开启（测试页已是 A4 竖向，与完整模式同方向原样打印）
      - TEST_ROTATE=0
      # 首次部署自动启用计划（配了 PRINTER_IP 即启动）；设为 0 可禁用
      - SCHEDULE_ENABLED=1
      # 配置与日志落盘位置（挂载卷内）
      - CONFIG_PATH=/app/data/config.json
      - LOG_PATH=/app/data/print_log.json
      # Web 管理界面 Basic Auth（可选，设置后需登录才能访问）
      # - WEB_USER=admin
      # - WEB_PASSWORD=change-me
      - TZ=Asia/Shanghai
